name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The dice-box install script only copies assets. scripts/copy-assets.mjs does that during the build.
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
        env:
          # Project pages are served from /<repository name>/.
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The site is moving to Cloudflare Pages, where it is served from the root of its own domain.
  # This job runs only after the tests in the build job pass.
  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    env:
      PROJECT: natone
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
        env:
          BASE_PATH: /
      - name: Create the Pages project on the first run
        run: |
          if npx --yes wrangler@4 pages project list | grep -qw "$PROJECT"; then
            echo "Project $PROJECT exists."
          else
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main
          fi
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=natone --branch=main
