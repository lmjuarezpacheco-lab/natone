name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

# One Cloudflare Pages project serves the whole domain: the author's page at the root (folder sitio/)
# and the extension under /natone/.
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT: natone
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The dice-box install script only copies assets. scripts/copy-assets.mjs does that during the build.
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /natone/
      - name: Put the root page and the extension together
        run: |
          mkdir -p site/natone
          cp -r sitio/. site/
          cp -r dist/. site/natone/
      - name: Create the Pages project on the first run
        run: |
          if npx --yes wrangler@4 pages project list | grep -qw "$PROJECT"; then
            echo "Project $PROJECT exists."
          else
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main
          fi
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=natone --branch=main
